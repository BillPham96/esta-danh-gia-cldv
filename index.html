<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESTA — Đánh giá chất lượng dịch vụ &amp; Áp dụng chế tài</title>
<meta name="description" content="Đánh giá chất lượng dịch vụ, ghi nhận vi phạm, áp dụng chế tài và tổng hợp khấu trừ tháng cho các dự án ESTA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Cormorant+Garamond:ital,wght@1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --aub:#411437; --aub-d:#2B1526; --aub-08:rgba(65,20,55,.08); --aub-15:rgba(65,20,55,.15);
  --cream:#F3DEBF; --cream-l:#F5ECD0; --paper:#FAFAF7; --card:#FFFDF8;
  --copper:#A46427; --copper-l:#F4E6D6; --taupe:#A99586; --stone:#625045;
  --ink:#1B1418; --ink-2:#4A3F45; --ink-3:#7A6E72; --line:#E6DCCD; --line-2:#D6C8B4;
  --bad:#9E3B2C; --bad-l:#F6E3DE; --ok:#2F5D46; --ok-l:#E3EEE6;
  --r:6px; --shadow:0 1px 2px rgba(43,21,38,.06), 0 4px 14px rgba(43,21,38,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;border:1px solid var(--line-2);border-radius:7px;background:#fff;padding:9px 11px;font-size:12.5px;outline:none;transition:border-color .15s, box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--copper);box-shadow:0 0 0 3px rgba(164,100,39,.15)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
textarea{resize:vertical;min-height:62px}
label.f{display:block;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--stone);margin:0 0 5px}
.hint{font-size:11px;color:var(--ink-3);margin-top:4px}
.req{color:var(--copper)}
.hidden{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:7px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s, border-color .15s, opacity .15s;letter-spacing:.01em}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--aub);color:var(--cream-l)} .btn-p:hover:not(:disabled){background:var(--aub-d)}
.btn-c{background:var(--copper);color:#fff} .btn-c:hover:not(:disabled){background:#8c531e}
.btn-o{background:transparent;border-color:var(--line-2);color:var(--ink-2)} .btn-o:hover:not(:disabled){border-color:var(--aub);color:var(--aub)}
.btn-g{background:transparent;color:var(--aub);padding:6px 8px} .btn-g:hover{background:var(--aub-08)}
.btn-bad{background:transparent;border-color:#d9b3aa;color:var(--bad)} .btn-bad:hover{background:var(--bad-l)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{padding:5px 10px;font-size:11.5px}
.ico{width:15px;height:15px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ======== LOGIN ======== */
#login{min-height:100vh;display:flex;align-items:stretch;background:var(--paper)}
#login .brandside{flex:0 0 40%;background:linear-gradient(160deg,var(--aub) 0%,var(--aub-d) 100%);color:var(--cream);padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
#login .brandside::after{content:'✱';position:absolute;right:-60px;bottom:-110px;font-size:420px;line-height:1;color:rgba(243,222,191,.06)}
.wm{display:flex;align-items:center;gap:12px}
.wm .star{color:var(--copper);font-size:26px;line-height:1}
.wm .t1{font-weight:800;font-size:22px;letter-spacing:.18em}
.wm .t2{font-weight:300;font-size:9.5px;letter-spacing:.32em;opacity:.8}
#login .wm{gap:15px}
#login .wm .star{font-size:38px;text-shadow:0 2px 12px rgba(164,100,39,.28)}
#login .wm .t1{font-size:28px;letter-spacing:.2em}
#login .wm .t2{font-size:10px;letter-spacing:.34em}
#login h1{font-weight:300;font-size:30px;line-height:1.25;margin:0 0 14px;letter-spacing:-.01em;text-transform:uppercase}
#login h1 b{font-weight:700}
#login .lede{font-size:13px;opacity:.8;max-width:360px}
#login .quote{font-size:14px;color:var(--cream);opacity:.75}
#login .formside{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.lcard{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:34px 30px;box-shadow:0 20px 50px rgba(15,23,42,.1);position:relative}
.lcard::before{content:'';position:absolute;top:0;left:22px;right:22px;height:2px;background:var(--copper)}
.lcard h2{margin:0 0 4px;font-size:17px;color:var(--aub)}
.lcard .sub{color:var(--ink-3);font-size:12px;margin-bottom:22px}
.lcard .row{margin-bottom:14px}
.err{background:var(--bad-l);color:var(--bad);border-radius:4px;padding:8px 10px;font-size:12px;margin-bottom:12px}
.demo-note{background:var(--copper-l);color:#6d4218;border-radius:4px;padding:9px 11px;font-size:11.5px;margin-bottom:16px}
@media (max-width:820px){#login{flex-direction:column}#login .brandside{flex:none;padding:32px 24px}#login .quote{display:none}}

/* ======== SHELL ======== */
header.top{background:var(--aub);color:var(--cream-l);position:sticky;top:0;z-index:40}
.topin{max-width:1640px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px;min-height:58px}
.topin .wm .t1{font-size:17px} .topin .wm .star{font-size:23px;text-shadow:0 1px 8px rgba(164,100,39,.3)}
.topin .apptitle{white-space:nowrap;border-left:1px solid rgba(243,222,191,.22);padding-left:18px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;color:var(--cream-l);opacity:.92}
nav.tabs{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{background:none;border:0;color:rgba(245,236,208,.72);padding:19px 10px 17px;font-size:12px;white-space:nowrap;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px}
nav.tabs button:hover{color:var(--cream-l)}
nav.tabs button.on{color:var(--cream-l);border-bottom-color:var(--copper)}
nav.tabs .badge{background:var(--copper);color:#fff;border-radius:9px;font-size:10px;padding:0 6px;line-height:16px}
.userchip{display:flex;align-items:center;gap:10px;font-size:11.5px}
.userchip .av{width:30px;height:30px;border-radius:50%;background:var(--copper);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.userchip .rl{opacity:.7;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.userchip button{background:none;border:1px solid rgba(243,222,191,.3);color:var(--cream-l);border-radius:4px;padding:6px 9px;cursor:pointer;font-size:11px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.userchip button:hover{border-color:var(--copper)}
.userchip .who{white-space:nowrap}
@media (max-width:1640px){
  .topin{flex-wrap:wrap;gap:0 14px;padding-top:8px}
  .topin .wm{order:1}
  .topin .apptitle{display:block;order:2;flex:1 1 300px;white-space:normal;padding-left:14px;font-size:9.5px}
  .topin .userchip{order:3;margin-left:auto}
  .topin nav.tabs{order:4;width:100%;margin-left:0;justify-content:center;overflow-x:auto;flex-wrap:nowrap}
}
@media (max-width:1280px){.userchip #btnData .who{display:none}}
@media (max-width:1100px){.userchip .who{display:none}}
@media (max-width:900px){
  .topin{flex-wrap:wrap;gap:8px;padding:8px 12px}
  .topin .apptitle{order:3;flex:1 0 100%;border-left:0;padding:0;text-align:center;font-size:9px}
  .topin nav.tabs{order:4;width:100%;margin-left:0;overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start}
  nav.tabs button{padding:10px 9px}
  .topin .userchip{order:2;margin-left:auto}
}
.demo-bar{background:var(--copper);color:#fff;font-size:11.5px;text-align:center;padding:5px 12px}
main{max-width:1640px;margin:0 auto;padding:22px 20px 60px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.pagehead h2{margin:0;font-size:20px;font-weight:700;color:var(--aub);letter-spacing:-.01em}
.pagehead .kicker{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--copper);font-weight:600;margin-bottom:4px}
.pagehead .desc{color:var(--ink-3);font-size:12px;margin-top:3px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar select,.toolbar input{width:auto;min-width:130px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:linear-gradient(0deg,rgba(245,236,208,.35),rgba(245,236,208,.35))}
.card-h h3{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--aub);display:flex;align-items:center;gap:9px}
.step{width:22px;height:22px;border-radius:50%;background:var(--aub);color:var(--cream-l);font-size:11px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:0}
.card-b{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.span2{grid-column:span 2}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.span2{grid-column:auto}}

/* create workspace */
.ws{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.ws-left{display:flex;flex-direction:column;gap:16px;min-width:0}
.ws>*,.sumgrid>*,.dgrid>*{min-width:0}
.ws-right{position:sticky;top:76px}
@media (max-width:1180px){.ws{grid-template-columns:1fr}.ws-right{position:static}}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.segs.two{grid-template-columns:1fr 1fr}
.seg{border:1px solid var(--line-2);background:#fff;border-radius:4px;padding:9px 8px;cursor:pointer;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2);transition:all .15s}
.seg small{display:block;font-weight:400;font-size:10px;color:var(--ink-3)}
.seg:hover{border-color:var(--aub)}
.seg.on{background:var(--aub);border-color:var(--aub);color:var(--cream-l)} .seg.on small{color:rgba(245,236,208,.75)}
.seg:disabled{opacity:.4;cursor:not-allowed}
@media (max-width:640px){.segs{grid-template-columns:1fr 1fr}}
.kv{background:var(--cream-l);border-radius:4px;padding:11px 13px;font-size:12px;display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin-top:12px}
.kv dt{color:var(--stone)} .kv dd{margin:0;font-weight:600;text-align:right}
.flag{display:flex;gap:8px;align-items:flex-start;background:var(--copper-l);color:#365A7A;border-radius:7px;padding:9px 11px;font-size:11.5px;margin-top:8px}
.flag.bad{background:var(--bad-l);color:var(--bad)}
.flag.ok{background:var(--ok-l);color:var(--ok)}
.flag .ico{margin-top:1px}
.line-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lineitem{border:1px solid var(--line);border-left:3px solid var(--copper);border-radius:4px;padding:10px 12px;background:#fff;display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.lineitem .t{font-weight:600;font-size:12px}
.lineitem .m{font-size:11px;color:var(--ink-3)}
.lineitem .amt{font-weight:700;color:var(--aub);text-align:right;font-variant-numeric:tabular-nums}
.lineitem .acts{grid-column:2;display:flex;gap:2px;justify-content:flex-end}
.totalbar{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--aub);color:var(--cream-l);border-radius:4px;margin-top:10px;font-size:12px}
.totalbar b{font-size:15px;font-variant-numeric:tabular-nums}
.levelpills{display:flex;gap:6px;flex-wrap:wrap}
.lp{border:1px solid var(--line-2);border-radius:14px;padding:4px 10px;font-size:11.5px;cursor:pointer;background:#fff}
.lp.on{background:var(--copper);border-color:var(--copper);color:#fff}
.suggest{font-size:11px;color:var(--copper);margin-top:5px;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.photos .ph{position:relative;aspect-ratio:4/3;border-radius:4px;overflow:hidden;background:var(--cream-l)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .x{position:absolute;top:4px;right:4px;background:rgba(27,20,24,.7);color:#fff;border:0;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:13px;line-height:22px}
.drop{border:1.5px dashed var(--line-2);border-radius:4px;padding:16px;text-align:center;color:var(--ink-3);cursor:pointer;font-size:12px;background:#fff}
.drop:hover{border-color:var(--copper);color:var(--copper)}
.actionbar{position:sticky;bottom:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 -6px 20px rgba(43,21,38,.06)}
.actionbar .st{margin-right:auto;font-size:11.5px;color:var(--ink-3)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:2px 9px;font-size:10.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.s-draft{background:#EEE9E3;color:var(--stone)}
.s-pending{background:var(--copper-l);color:#8a5320}
.s-approved{background:var(--ok-l);color:var(--ok)}
.s-returned{background:var(--bad-l);color:var(--bad)}
.s-rejected{background:var(--bad-l);color:var(--bad)}

/* preview */
.pv-wrap{background:#E9E2D6;border-radius:var(--r);padding:18px;max-height:calc(100vh - 110px);overflow:auto}
.pv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;color:var(--stone);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.pv-scale{transform-origin:top left}
@media (max-width:1180px){.pv-wrap{max-height:none}}

/* tables */
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);font-weight:700;padding:10px 12px;border-bottom:1.5px solid var(--line-2);background:var(--cream-l);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:rgba(245,236,208,.35)}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t .muted{color:var(--ink-3);font-size:11px}
.empty{padding:40px 20px;text-align:center;color:var(--ink-3)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
@media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{padding:16px 18px}
.kpi .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--stone);font-weight:600}
.kpi .v{font-size:26px;font-weight:700;color:var(--aub);margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:11px;color:var(--ink-3);margin-top:2px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1000px){.dgrid{grid-template-columns:1fr}}
.hbar{display:grid;grid-template-columns:170px 1fr 110px;gap:10px;align-items:center;padding:6px 0;font-size:12px}
.hbar .trk{height:14px;position:relative}
.hbar .fill{height:100%;background:var(--aub);border-radius:0 4px 4px 0;min-width:2px}
.hbar .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vbars{display:flex;align-items:flex-end;gap:14px;height:180px;padding:10px 4px 0;border-bottom:1px solid var(--line-2)}
.vbars .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.vbars .bar{width:min(46px,70%);background:var(--aub);border-radius:4px 4px 0 0;min-height:2px;cursor:default}
.vbars .bar.cur{background:var(--copper)}
.vbars .cap{font-size:10.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px;font-variant-numeric:tabular-nums}
.vlabels{display:flex;gap:14px;padding:6px 4px 0}
.vlabels div{flex:1;text-align:center;font-size:10.5px;color:var(--ink-3)}
.tip{position:fixed;pointer-events:none;background:var(--aub-d);color:var(--cream-l);font-size:11px;padding:6px 9px;border-radius:4px;z-index:100;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.2)}

/* summary */
.sumgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1180px){.sumgrid{grid-template-columns:1fr}}
.calc{display:grid;grid-template-columns:1fr auto;gap:7px 16px;font-size:12.5px}
.calc .k{color:var(--ink-2)} .calc .v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.calc .tot{border-top:1.5px solid var(--aub);padding-top:8px;font-weight:700;color:var(--aub);font-size:14px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(27,20,24,.5);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:var(--card);border-radius:6px;width:min(560px,100%);box-shadow:0 30px 70px rgba(0,0,0,.3)}
.modal.wide{width:min(980px,100%)}
.modal .mh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mh h3{margin:0;font-size:15px;color:var(--aub)}
.modal .mb{padding:18px 20px;max-height:70vh;overflow:auto}
.modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* toast */
#toasts{position:fixed;bottom:22px;right:22px;z-index:120;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--aub-d);color:var(--cream-l);padding:11px 16px;border-radius:4px;font-size:12.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);border-left:3px solid var(--copper);max-width:380px;animation:tin .2s ease}
.toast.bad{border-left-color:#e48a78}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#busy{position:fixed;inset:0;background:rgba(250,250,247,.75);z-index:110;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--aub);font-weight:600}
.spin{width:34px;height:34px;border:3px solid var(--aub-15);border-top-color:var(--copper);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ============== DOCUMENT (A4) ============== */
.doc{width:794px;min-height:1123px;background:#fff;color:#111;padding:54px 60px 60px;font-family:'Montserrat',sans-serif;font-size:11.5px;line-height:1.55;box-shadow:0 4px 18px rgba(43,21,38,.12);position:relative}
.doc.pdf{width:688px;min-height:0;padding:0;box-shadow:none}
.doc .strip{display:flex;justify-content:space-between;align-items:center;border-bottom:1.5px solid var(--aub);padding-bottom:8px;margin-bottom:14px}
.doc .strip .b{display:flex;align-items:center;gap:8px;color:var(--aub)}
.doc .strip .b .s{color:var(--copper);font-size:16px;line-height:1}
.doc .strip .b .n{font-weight:800;letter-spacing:.2em;font-size:12px}
.doc .strip .b .m{font-weight:300;letter-spacing:.24em;font-size:7.5px}
.doc .strip .r{font-size:8.5px;letter-spacing:.14em;color:var(--stone);text-transform:uppercase}

  const t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.textContent=msg;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(), bad?6000:3200);
}
function busy(on, text='Đang xử lý…'){
  let b=$('#busy');
  if(on){ if(!b){ b=document.createElement('div'); b.id='busy'; document.body.appendChild(b);} b.innerHTML=`<div class="spin"></div><div>${esc(text)}</div>`; }
  else if(b) b.remove();
}
function modal({title, body, foot, wide, onMount}){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal ${wide?'wide':''}"><div class="mh"><h3>${esc(title)}</h3><button class="btn btn-g" data-x>${ic('x')}</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div>`;
  document.body.appendChild(bg);
  const close=()=>bg.remove();
  bg.addEventListener('click', e=>{ if(e.target===bg || e.target.closest('[data-x]')) close(); });
  if(onMount) onMount(bg, close);
  return {el:bg, close};
}
function confirmBox(title, msg, okText='Đồng ý', danger){
  return new Promise(res=>{
    modal({title, body:`<p style="margin:0">${msg}</p>`, foot:`<button class="btn btn-o" data-x>Hủy</button><button class="btn ${danger?'btn-bad':'btn-p'}" data-ok>${esc(okText)}</button>`,
      onMount:(el,close)=>{ el.querySelector('[data-ok]').onclick=()=>{close();res(true);}; el.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>res(false))); }});

}
function promptBox(title, label, placeholder=''){
  return new Promise(res=>{
    modal({title, body:`<label class="f">${esc(label)}</label><textarea id="pbx" rows="3" placeholder="${esc(placeholder)}"></textarea>`,
      foot:`<button class="btn btn-o" data-x>Hủy</button><button class="btn btn-p" data-ok>Xác nhận</button>`,
      onMount:(el,close)=>{ const ta=el.querySelector('#pbx'); ta.focus(); el.querySelector('[data-ok]').onclick=()=>{const v=ta.value.trim(); close(); res(v||'');}; el.querySelectorAll('[data-x]').forEach(b=>b.addEventListener('click',()=>res(null))); }});
  });
}

/* ---------- Số tiền bằng chữ ---------- */
function numToWords(n){
  n=Math.round(Number(n)||0); if(n===0) return 'Không đồng';
  const ch=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const read3=(num, full)=>{
    const h=Math.floor(num/100), t=Math.floor(num%100/10), u=num%10; let s=[];
    if(full || h>0){ s.push(ch[h]+' trăm'); }
    if(t>1){ s.push(ch[t]+' mươi'); if(u===1) s.push('mốt'); else if(u===5) s.push('lăm'); else if(u>0) s.push(ch[u]); }
    else if(t===1){ s.push('mười'); if(u===5) s.push('lăm'); else if(u>0) s.push(ch[u]); }
    else { if(u>0 && (full||h>0)) s.push('lẻ'); if(u>0) s.push(ch[u]); }
    return s.join(' ');
  };
  const units=['',' nghìn',' triệu',' tỷ',' nghìn tỷ',' triệu tỷ'];
  let parts=[], i=0, neg=n<0; n=Math.abs(n);
  const groups=[]; while(n>0){ groups.push(n%1000); n=Math.floor(n/1000); }
  for(let k=groups.length-1;k>=0;k--){
    const g=groups[k]; if(g===0) continue;
    parts.push(read3(g, k<groups.length-1)+units[k]);
  }
  let s=parts.join(' ').replace(/\s+/g,' ').trim(); s=s.charAt(0).toUpperCase()+s.slice(1)+' đồng';
  return (neg?'Âm ':'')+s;
}

/* ---------- Nén ảnh ---------- */
function compressImage(file, maxDim=1280, q=0.72){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      let {width:w,height:h}=img; const s=Math.min(1, maxDim/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
      let out=c.toDataURL('image/jpeg', q);
      if(out.length>700000) out=c.toDataURL('image/jpeg', 0.55);
      res(out);
    }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

const DB = { records:[], contracts:{}, audits:{}, notices:[] };
let STORE = null;

/* ---------- Lưu trữ trên máy: IndexedDB (dung lượng lớn, đủ chứa ảnh) ---------- */
const KV = (()=>{
  let dbp=null; const mem={};
  function open(){
    if(dbp) return dbp;
    dbp=new Promise((res)=>{
      try{
        const rq=indexedDB.open('esta_cldv', 1);
        rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');
        rq.onsuccess=()=>res(rq.result); rq.onerror=()=>res(null); rq.onblocked=()=>res(null);
      }catch(e){ res(null); }
    });
    return dbp;
  }
  async function tx(mode, fn){
    const db=await open(); if(!db) return fn(null);
    return new Promise((res,rej)=>{ const t=db.transaction('kv',mode); const st=t.objectStore('kv'); let out; const r=fn(st); if(r) r.onsuccess=()=>{out=r.result;}; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error||new Error('Bộ nhớ trình duyệt đầy hoặc bị chặn')); });
  }
  return {
    async get(k){ const db=await open(); if(!db) return mem[k]; return tx('readonly', st=>st.get(k)); },
    async set(k,v){ const db=await open(); if(!db){ mem[k]=v; return; } return tx('readwrite', st=>st.put(v,k)); },
    async del(k){ const db=await open(); if(!db){ delete mem[k]; return; } return tx('readwrite', st=>st.delete(k)); },
    async ok(){ return !!(await open()); },
  };
})();

const LocalStore = (()=>{
  let listeners=()=>{};
  const save=async(k)=>{ try{ await KV.set(k, JSON.parse(JSON.stringify(DB[k]))); }catch(e){ toast('Không lưu được vào bộ nhớ trình duyệt: '+e.message+'. Hãy Xuất file sao lưu ngay.', true); throw e; } };
  return {
    async init(user, onChange){
      listeners=onChange;
      if(!(await KV.ok())) toast('Trình duyệt đang chặn bộ nhớ (chế độ ẩn danh?) — dữ liệu sẽ mất khi đóng trang. Hãy dùng cửa sổ thường.', true);
      DB.records=(await KV.get('records'))||[]; DB.contracts=(await KV.get('contracts'))||{}; DB.audits=(await KV.get('audits'))||{}; DB.notices=(await KV.get('notices'))||[];
      DB.records.forEach(r=>{ if(!r.status) r.status='draft'; if(r.status==='returned') r.status='rejected'; });
      onChange('all');
    },
    async saveRecord(r){ r.updatedAt=new Date().toISOString(); const i=DB.records.findIndex(x=>x.id===r.id); if(i>=0) DB.records[i]=r; else DB.records.push(r); await save('records'); listeners('records'); return r.id; },
    async deleteRecord(id){ DB.records=DB.records.filter(x=>x.id!==id); await KV.del('ph_'+id); await save('records'); listeners('records'); },
    async savePhotos(id, b, arr){ await KV.set('ph_'+id, arr.slice()); },
    async loadPhotos(id){ return ((await KV.get('ph_'+id))||[]).slice(); },
    async saveContract(k, c){ DB.contracts[k]=c; await save('contracts'); listeners('contracts'); },
    async resetContract(k){ delete DB.contracts[k]; await save('contracts'); listeners('contracts'); },
    async saveAudit(k, a){ DB.audits[k]=a; await save('audits'); listeners('audits'); },
    async saveNotice(n){ const i=DB.notices.findIndex(x=>x.id===n.id); if(i>=0) DB.notices[i]=n; else DB.notices.push(n); await save('notices'); listeners('notices'); },
    async deleteNotice(id){ DB.notices=DB.notices.filter(x=>x.id!==id); await save('notices'); listeners('notices'); },
    // ---- Sao lưu / khôi phục ----
    async exportData(user){
      const inScope = x => user.role==='admin' || x.building===user.building;
      const records=DB.records.filter(inScope); const photos={};
      for(const r of records){ const p=await KV.get('ph_'+r.id); if(p&&p.length) photos[r.id]=p; }
      const audits={}; Object.entries(DB.audits).forEach(([k,v])=>{ if(inScope(v)) audits[k]=v; });
      return {app:'esta-danh-gia-cldv', version:1, exportedAt:new Date().toISOString(), exportedBy:user.id, scope:user.role==='admin'?'all':user.building,
        records, photos, audits, notices:DB.notices.filter(inScope), contracts:user.role==='admin'?DB.contracts:{}};
    },
    async importData(data, user, withContracts){
      if(!data || data.app!=='esta-danh-gia-cldv') throw new Error('File không đúng định dạng sao lưu của web này.');
      const inScope = x => user.role==='admin' || x.building===user.building;
      let add=0, upd=0, skip=0;
      for(const r of (data.records||[])){
        if(!inScope(r)){ skip++; continue; }
        if(!r.status) r.status='draft'; if(r.status==='returned') r.status='rejected';
        const i=DB.records.findIndex(x=>x.id===r.id);
        if(i<0){ DB.records.push(r); add++; }
        else if((r.updatedAt||'')>(DB.records[i].updatedAt||'')){ DB.records[i]=r; upd++; } else { skip++; continue; }
        if(data.photos && data.photos[r.id]) await KV.set('ph_'+r.id, data.photos[r.id]);
      }
      Object.entries(data.audits||{}).forEach(([k,v])=>{ if(!inScope(v)) return; const cur=DB.audits[k]; if(!cur || (v.at||'')>(cur.at||'')) DB.audits[k]=v; });
      (data.notices||[]).forEach(n=>{ if(!inScope(n)) return; const i=DB.notices.findIndex(x=>x.id===n.id); if(i<0) DB.notices.push(n); else if((n.createdAt||'')>(DB.notices[i].createdAt||'')) DB.notices[i]=n; });
      const ctCount=Object.keys(data.contracts||{}).length;
      if(withContracts && ctCount) Object.assign(DB.contracts, data.contracts);
      await save('records'); await save('audits'); await save('notices'); if(withContracts) await save('contracts');
      listeners('all');
      return {add, upd, skip, ct: withContracts?ctCount:0};
    },
  };
})();

function getContract(key){
  const saved = DB.contracts[key];
  const seed = CONTRACT_SEED[key];
  if(saved) return {...seed, ...saved, _edited:true};
  return seed ? {...seed} : null;
}
function contractKeysFor(user){
  const keys=[]; Object.keys(BUILDINGS).forEach(b=>{ if(user.role==='admin' || user.building===b){ ['SECURITY','CLEANING'].forEach(s=>keys.push(ckey(b,s))); } });
  return keys;
}
function contractLabel(k){ const c=getContract(k); return `${BUILDINGS[c.building].name} · ${SERVICES[c.service].name}`; }
function contractExpired(c){ return c.termTo && c.termTo < new Date().toISOString().slice(0,10); }
function partyBShort(c){ return (c.partyB&&c.partyB.name||'(chưa có nhà thầu)').replace(/^CÔNG TY (TNHH|CỔ PHẦN|CP)\s*/i,'').replace(/^DỊCH VỤ BẢO VỆ\s*/i,'DVBV '); }

/** Số tiền của 1 dòng lỗi theo HĐ */
function levelOf(item, level){ const L=item.levels||[]; if(!L.length) return {a:0,t:''}; return L[Math.min(Math.max(level,1),L.length)-1]; }
function baseValue(c, lvl, line){
  if(lvl.base==='fee') return Number(c.monthlyFee)||0;
  if(lvl.base==='contract') return Number(c.contractValue)||0;
  if(lvl.base==='asset') return Number(line.assetValue)||0;
  return 0;
}
function contractAmount(c, item, line){
  const l=levelOf(item, line.level); const q=Math.max(1, Number(line.qty)||1);
  if(l.pct!=null){ const p=line.pctUsed!=null?Number(line.pctUsed):l.pct; return Math.round(baseValue(c,l,line)*p/100)*q; }
  if(l.min!=null) return (Number(l.min)||0)*q;
  return (Number(l.a)||0)*q;
}
function amountRange(c, item, line){
  const l=levelOf(item, line.level); const q=Math.max(1, Number(line.qty)||1);
  if(l.pct!=null && l.pctMax!=null){ const b=baseValue(c,l,line); return [Math.round(b*l.pct/100)*q, Math.round(b*l.pctMax/100)*q]; }
  if(l.min!=null) return [l.min*q, l.max!=null?l.max*q:null];
  return null;
}
/** Đếm số lần vi phạm trước đó cùng mã lỗi (để gợi ý Lần 1/2/3) */
function priorCount(rec, code, uptoLineIdx){
  const c=getContract(rec.contractKey); const per = c && c.offensePeriod==='term' ? null : periodOf(rec.dateTime);
  let n=0;
  DB.records.forEach(r=>{
    if(r.id===rec.id || r.contractKey!==rec.contractKey) return;
    if(per && periodOf(r.dateTime)!==per) return;
    if((r.dateTime||'') > (rec.dateTime||'')) return;
    (r.lines||[]).forEach(l=>{ if(l.code===code) n++; });
  });
  (rec.lines||[]).forEach((l,i)=>{ if(i<uptoLineIdx && l.code===code) n++; });
  return n;
}
function recTotals(r){ let fine=0, comp=0; (r.lines||[]).forEach(l=>{ fine+=Number(l.amount)||0; comp+=Number(l.comp)||0; }); return {fine, comp}; }
function nextRecordNo(rec){
  const y=(rec.dateTime||nowLocal()).slice(0,4); const svc=SERVICES[rec.service].code; const b=BUILDINGS[rec.building].short;
  const same=DB.records.filter(r=>r.no && r.building===rec.building && r.service===rec.service && (r.no.split('/')[1]===y));
  let mx=0; same.forEach(r=>{ const n=parseInt(r.no,10); if(n>mx) mx=n; });
  return `${pad(mx+1,3)}/${y}/BB-${svc}-${b}`;
}
function nextNoticeNo(n){
  const y=(n.date||nowLocal()).slice(0,4); const b=BUILDINGS[n.building].short;
  const same=DB.notices.filter(x=>x.no && x.building===n.building && x.no.split('/')[1]===y);
  let mx=0; same.forEach(x=>{ const k=parseInt(x.no,10); if(k>mx) mx=k; });
  return `${pad(mx+1,3)}/${y}/TB-ESTA-${b}`;
}

/** Tổng hợp tháng cho 1 hợp đồng */
function monthSummary(key, period){
  const c=getContract(key);
  const recs=DB.records.filter(r=>r.contractKey===key && periodOf(r.dateTime)===period).sort((a,b)=>(a.dateTime||'').localeCompare(b.dateTime||''));
  const approved=recs.filter(r=>r.status==='approved');
  const notApproved=recs.filter(r=>r.status!=='approved');
  let fines=0, comp=0, lines=0; approved.forEach(r=>{ const t=recTotals(r); fines+=t.fine; comp+=t.comp; lines+=(r.lines||[]).length; });
  const fee=Number(c.monthlyFee)||0;
  const audit=DB.audits[`${key}_${period}`]||{};
  const score = audit.score===''||audit.score==null ? null : Number(audit.score);
  let tier=null, gap=false;
  if(score!=null && (c.tiers||[]).length){ tier=(c.tiers||[]).find(t=>score>=t.min-1e-9 && score<=t.max+1e-9)||null; if(!tier) gap=true; }
  let qPct = tier ? Number(tier.pct)||0 : 0;
  if(gap || (audit.manualPct!=null && audit.manualPct!=='')) qPct = Number(audit.manualPct)||0;
  const alerts=[]; let extraPct=0;
  const R=c.tierRules||{};
  if(R.consecutiveBelow && score!=null){
    const th=R.consecutiveBelow.threshold, m=R.consecutiveBelow.months; let ok=true;
    for(let i=0;i<m;i++){ const a=DB.audits[`${key}_${addMonths(period,-i)}`]; const s=a&&a.score!==''&&a.score!=null?Number(a.score):null; if(s==null||s>=th){ok=false;break;} }
    if(ok){ extraPct=R.consecutiveBelow.pct; alerts.push({lv:'bad', t:R.consecutiveBelow.text}); }
  }
  if(R.windowBelow){
    let cnt=0; for(let i=0;i<R.windowBelow.window;i++){ const a=DB.audits[`${key}_${addMonths(period,-i)}`]; const s=a&&a.score!==''&&a.score!=null?Number(a.score):null; if(s!=null&&s<R.windowBelow.threshold) cnt++; }
    if(cnt>=R.windowBelow.months) alerts.push({lv:'bad', t:`${cnt} tháng < ${R.windowBelow.threshold}% trong 06 tháng gần nhất. `+R.windowBelow.text});
  }
  if(gap) alerts.push({lv:'warn', t:`Điểm ${score}% nằm ngoài các khung của HĐ — mức trừ đang dùng là mức nhập thủ công (${qPct}%).`});
  const qualityDeduct=Math.round(fee*(qPct+extraPct)/100);
  const penaltyTotal=fines+qualityDeduct;
  const capAmt=Math.round(fee*(Number(c.capPct)||8)/100);
  if(fee>0 && penaltyTotal>capAmt) alerts.push({lv:'warn', t:`Tổng tiền phạt ${fmtd(penaltyTotal)} vượt ${c.capPct||8}% phí dịch vụ tháng (${fmtd(capAmt)}). Điều 301 Luật Thương mại 2005: mức phạt vi phạm không quá 8% giá trị phần nghĩa vụ bị vi phạm — Quản lý vận hành cân nhắc trước khi chốt.`});
  // ngưỡng số lần vi phạm
  if(c.countRule && c.countRule.perMonth && lines>=c.countRule.perMonth) alerts.push({lv:'bad', t:`${lines} lỗi vi phạm trong tháng. ${c.countRule.text}`});
  (c.items||[]).forEach(it=>{
    if(!it.countRule) return;
    const m=approved.reduce((s,r)=>s+(r.lines||[]).filter(l=>l.code===it.code).length,0);
    const all=DB.records.filter(r=>r.contractKey===key&&r.status==='approved').reduce((s,r)=>s+(r.lines||[]).filter(l=>l.code===it.code).length,0);
    if(m>=it.countRule.perMonth) alerts.push({lv:'bad', t:`Lỗi "${it.title}": ${m} biên bản trong tháng (ngưỡng ${it.countRule.perMonth}) → Bên A có quyền chấm dứt HĐ (${it.ref}).`});
    else if(it.countRule.cumulative && all>=it.countRule.cumulative) alerts.push({lv:'bad', t:`Lỗi "${it.title}": ${all} biên bản cộng dồn (ngưỡng ${it.countRule.cumulative}) → Bên A có quyền chấm dứt HĐ (${it.ref}).`});
  });
  approved.forEach(r=>(r.lines||[]).forEach(l=>{ if(/chấm dứt|dừng/i.test(l.action||'')) alerts.push({lv:'bad', t:`BB ${r.no}: lỗi "${l.title}" có chế tài "${l.action}".`}); }));
  if(notApproved.length) alerts.push({lv:'warn', t:`Còn ${notApproved.length} biên bản chưa được duyệt trong tháng — chưa được tính vào tổng hợp.`});
  return {c, recs, approved, notApproved, fines, comp, fee, audit, score, tier, gap, qPct, extraPct, qualityDeduct, penaltyTotal, capAmt, total:penaltyTotal+comp, alerts, lines};
}

function renderRecordDoc(rec, photos, opt={}){
  const c=getContract(rec.contractKey); const b=BUILDINGS[rec.building]; const S=SERVICES[rec.service];
  const t=recTotals(rec);
  const lines=rec.lines||[];
  const rows = lines.length ? lines.map((l,i)=>`<tr>
      <td class="c">${i+1}</td>
      <td><b>${esc(l.title)}</b><div style="color:#666;font-size:9.5px">${esc(l.ref||'')}</div></td>
      <td class="c">${l.level||1}</td>

      <td>${nl2br(l.detail||'')}</td>

const NOTICE_TYPES = {
  remind1:{label:'Nhắc nhở lần 1', subject:'Thông báo vi phạm và yêu cầu khắc phục chất lượng dịch vụ (lần 1)'},
  remind2:{label:'Nhắc nhở lần 2', subject:'Thông báo vi phạm và yêu cầu khắc phục chất lượng dịch vụ (lần 2)'},
  final:{label:'Cảnh cáo lần cuối', subject:'Cảnh cáo vi phạm – yêu cầu khắc phục lần cuối trước khi xem xét chấm dứt Hợp đồng'},
  quality:{label:'Nhắc nhở chất lượng tháng', subject:'Nhắc nhở kết quả đánh giá chất lượng dịch vụ tháng'},
};
function renderNoticeDoc(n, opt={}){
  const c=getContract(n.contractKey); const b=BUILDINGS[c.building]; const Sv=SERVICES[c.service]; const T=NOTICE_TYPES[n.type]||NOTICE_TYPES.remind1;
  const recs=(n.recordIds||[]).map(id=>DB.records.find(r=>r.id===id)).filter(Boolean).sort((a,b)=>(a.dateTime||'').localeCompare(b.dateTime||''));
  let stt=0, sum=0, needReplace=false;
  const rows=recs.flatMap(r=>(r.lines||[]).map(l=>{ sum+=Number(l.amount)||0; if(/thay|điều chuyển|sa thải|đổi người/i.test(l.action||'')) needReplace=true;
    return `<tr><td class="c">${++stt}</td><td>${dDMY(r.dateTime)} ${tHM(r.dateTime)}</td><td>${esc(r.no||'')}</td><td>${esc(l.title)}${r.violator?`<div style="font-size:9.5px;color:#666">Nhân sự: ${esc(r.violator)}</div>`:''}</td><td class="c">${l.level||1}</td><td>${esc(l.action||'')}</td><td class="r">${fmt(l.amount)}</td></tr>`; })).join('');
  const S = n.period ? monthSummary(n.contractKey, n.period) : null;
  const reqs=[];
  reqs.push(`Chấn chỉnh ngay đội ngũ nhân sự tại Tòa nhà ${esc(b.name)}; khắc phục triệt để các vi phạm nêu trên trong vòng <b>${n.deadlineDays||c.remedyDays||3} ngày</b> kể từ ngày nhận Thông báo này.`);
  if(needReplace) reqs.push(`Thay thế/điều chuyển nhân sự vi phạm theo đúng chế tài của Hợp đồng${c.service==='SECURITY'?' (thời hạn tối đa 24 giờ)':''} và cập nhật danh sách nhân sự cho Ban Quản lý Tòa nhà.`);
  reqs.push(`Báo cáo bằng văn bản kết quả khắc phục và biện pháp phòng ngừa tái diễn gửi Ban Quản lý Tòa nhà trước thời hạn nêu trên.`);
  if(sum) reqs.push(`Tổng tiền phạt <b>${fmtd(sum)}</b> (${numToWords(sum).toLowerCase()}) được khấu trừ trực tiếp vào phí dịch vụ tháng ${periodLabel(n.period)} theo biên bản đã ký.`);
  if(n.type==='quality' && S && S.score!=null) reqs.splice(0,0,`Kết quả đánh giá chất lượng dịch vụ tháng ${periodLabel(n.period)}: <b>${S.score}%</b>${S.tier?` – ${esc(S.tier.label)}; chế tài: ${esc(S.tier.action)}`:''}.`);
  const warn = n.type==='remind1' ? '' : `<p><b>Lưu ý:</b> ${esc(c.clauses.notice||'')} ${n.type==='final'?esc(c.clauses.termination||''):''}</p>`;
  const signer=n.signer||stripTitle(c.partyA.rep); const role=n.signerRole||c.partyA.repRole||'Giám đốc';
  return `<div class="doc ${opt.pdf?'pdf':''}">
    ${!opt.issued?`<div class="watermark">DỰ THẢO</div>`:''}
    ${docStrip('Thông báo nhà thầu · '+Sv.name)}
    ${docHdr(c, n.no, n.date)}
    <h1>THÔNG BÁO</h1>
    <div class="h1sub">V/v: ${esc(n.subject||T.subject)}</div>
    <p style="text-align:center;margin:6px 0 12px"><b>Kính gửi: ${esc(c.partyB.name||'……………')}</b></p>
    <ul class="basis">${basisList(c).map(x=>`<li>${x}</li>`).join('')}${recs.length?`<li>Căn cứ ${recs.length} biên bản ghi nhận vi phạm đã được các bên ký xác nhận.</li>`:''}</ul>
    <p>${esc(c.partyA.name)} – Ban Quản lý Tòa nhà ${esc(b.name)} (do ESTA Property Management vận hành) trân trọng thông báo đến Quý Công ty về các vi phạm trong quá trình cung cấp ${esc(Sv.full.toLowerCase())} tại Tòa nhà${n.period?` trong tháng ${periodLabel(n.period)}`:''} như sau:</p>
    ${rows?`<table class="dt"><thead><tr><th style="width:26px">STT</th><th style="width:78px">Thời điểm</th><th style="width:110px">Số biên bản</th><th>Hành vi vi phạm</th><th style="width:30px">Lần</th><th style="width:120px">Chế tài</th><th style="width:70px">Phạt (đ)</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="6" class="r">TỔNG CỘNG</td><td class="r">${fmt(sum)}</td></tr></tfoot></table>`:''}
    ${n.body?`<p style="margin-top:8px">${nl2br(n.body)}</p>`:''}
    <p style="margin-top:8px">Để bảo đảm chất lượng dịch vụ theo cam kết tại Hợp đồng, Ban Quản lý Tòa nhà đề nghị Quý Công ty:</p>
    <ol style="margin:0 0 8px 18px;padding:0">${reqs.map(x=>`<li style="margin-bottom:4px">${x}</li>`).join('')}</ol>
    ${warn}
    <p>Trân trọng thông báo và đề nghị Quý Công ty nghiêm túc thực hiện./.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:14px;font-size:10.5px;page-break-inside:avoid">
      <div><b><i>Nơi nhận:</i></b><div>– Như trên;</div><div>– BQL Tòa nhà ${esc(b.name)};</div><div>– ESTA – Quản lý vận hành;</div><div>– Lưu VT.</div></div>
      <div style="text-align:center"><div class="role" style="font-weight:700;text-transform:uppercase">TM. ${esc(c.partyA.name)}</div><div style="font-weight:700;text-transform:uppercase">${esc(role)}</div><div style="height:78px"></div><div style="font-weight:700">${esc(signer)}</div></div>
    </div>
    <div class="foot">${FOOTER}</div>
  </div>`;
}

const PDF_W=688; // px chiều rộng vùng nội dung (210-26 mm)
async function exportPDF(html, filename){
  if(window.NO_DOWNLOAD){ toast('Bản xem thử không tải file được. Nút Xuất PDF hoạt động trên bản chính thức (GitHub Pages).', true); return; }

  busy(true,'Đang tạo PDF…');
  const sx=window.scrollX, sy=window.scrollY; window.scrollTo(0,0);
  const host=document.createElement('div'); host.style.cssText=`position:absolute;left:0;top:0;width:${PDF_W}px;background:#fff;z-index:-1`;
  host.innerHTML=html; document.body.appendChild(host);
  try{
    await document.fonts.ready;
    await Promise.all($$('img',host).map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;})));
    const wmText=($('.watermark',host)||{}).textContent||'';
    $$('.watermark',host).forEach(w=>w.remove());
    const wmImg=wmText?watermarkImage(wmText):null;
    const pdf=new window.jspdf.jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
    const mmPerPx=(210-PDF_M.left-PDF_M.right)/PDF_W;
    const pageH=Math.floor((297-PDF_M.top-PDF_M.bottom)/mmPerPx);
    let first=true;
    for(const doc of $$(':scope > .doc', host)){
      const breaks=computeBreaks(doc, pageH);
      const canvas=await html2canvas(doc, {scale:2, useCORS:true, backgroundColor:'#ffffff', logging:false, scrollX:0, scrollY:0, windowWidth:PDF_W});
      const k=canvas.width/doc.offsetWidth;
      for(let i=0;i<breaks.length-1;i++){
        const y0=breaks[i], y1=breaks[i+1]; const hpx=Math.max(1,Math.round((y1-y0)*k));
        const pc=document.createElement('canvas'); pc.width=canvas.width; pc.height=hpx;
        const cx=pc.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,pc.width,pc.height);
        cx.drawImage(canvas, 0, Math.round(y0*k), canvas.width, hpx, 0, 0, canvas.width, hpx);
        if(!first) pdf.addPage(); first=false;
        pdf.addImage(pc.toDataURL('image/jpeg',0.92), 'JPEG', PDF_M.left, PDF_M.top, 210-PDF_M.left-PDF_M.right, (y1-y0)*mmPerPx, undefined, 'FAST');
      }
    }
    const n=pdf.internal.getNumberOfPages();
    for(let i=1;i<=n;i++){
      pdf.setPage(i);
      if(wmImg) pdf.addImage(wmImg, 'PNG', 10, 90, 190, 106);
      pdf.setFontSize(7); pdf.setTextColor(169,149,134); pdf.text(`${i}/${n}`, 210-PDF_M.right, 297-6, {align:'right'});
    }
    pdf.save(filename);
    toast('Đã xuất '+filename);
  }catch(e){ console.error(e); toast('Xuất PDF lỗi: '+e.message, true); }
  finally{ host.remove(); busy(false); window.scrollTo(sx,sy); }
}
function computeBreaks(doc, pageH){
  const base=doc.getBoundingClientRect().top; const total=doc.scrollHeight;
  const iv=[]; // khoảng không được cắt
  const add=(t,b)=>{ if(b-t>2) iv.push([t,b]); };
  $$('tr, .sign, .imgs figure, .alert, .box, .parties .pb, .kpirow, .words, p, li, .hdr, .strip, h1, .h1sub, .approval, .foot', doc).forEach(el=>{ const r=el.getBoundingClientRect(); add(r.top-base, r.bottom-base); });
  $$('h4', doc).forEach(h=>{ const r=h.getBoundingClientRect(); const nx=h.nextElementSibling; let b=r.bottom-base; if(nx){ const q=nx.getBoundingClientRect(); b=Math.min(q.bottom-base, q.top-base+70); } add(r.top-base-2, b); });
  const forced=$$('.pb-force', doc).map(el=>el.getBoundingClientRect().top-base);
  const inside=y=>iv.filter(([t,b])=>t<y-0.5 && b>y+0.5);
  const br=[0]; let start=0, guard=0;
  while(start < total-4 && guard++<200){
    let y=Math.min(start+pageH, total);
    const f=forced.find(v=>v>start+20 && v<y); if(f!=null) y=f;
    if(y<total){
      let tries=0, c;
      while((c=inside(y)).length && tries++<60){ y=Math.min(...c.map(x=>x[0]))-1; }
      if(y<=start+pageH*0.25) y=Math.min(start+pageH, total); // khối quá lớn → cắt cứng
    }
    br.push(y); start=y;
  }
  if(br[br.length-1]<total-4) br.push(total);
  return br;
}
function watermarkImage(text){
  const c=document.createElement('canvas'); c.width=1800; c.height=1000; const x=c.getContext('2d');
  x.translate(900,500); x.rotate(-24*Math.PI/180); x.font="800 96px Montserrat, sans-serif"; x.textAlign='center'; x.textBaseline='middle';
  x.fillStyle='rgba(158,59,44,0.11)'; x.fillText(text, 0, 0);
  return c.toDataURL('image/png');
}

  $$('[data-b]',v).forEach(b=>b.onclick=()=>switchContract(b.dataset.b, d.service));

  if($('#btnNew')) $('#btnNew').onclick=async()=>{ if(CUR.dirty && !(await confirmBox('Lập biên bản mới','Bỏ các thay đổi chưa lưu?','Bỏ thay đổi',true))) return; CUR.dirty=false; CUR.draft=newDraft(); CUR.draftPhotos=[]; CUR.prevPhotoCount=0; renderView(); };
  // photos

  fi.onchange=()=>{ addPhotos(fi.files); fi.value=''; };
  renderPhotos(); renderLineBox(); renderActionBar(); refreshPreview();
  window.onresize=()=>scalePreview();
}
function addDays(dt, n){ const d=new Date((dt||nowLocal()).slice(0,10)+'T00:00:00'); d.setDate(d.getDate()+Number(n||0)); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function suggestRemedy(d){
  const acts=[]; (d.lines||[]).forEach(l=>{ if(l.action && !acts.includes(l.action)) acts.push(l.action); });
  const c=getContract(d.contractKey);
  let s='Bên B chấn chỉnh ngay nhân sự vi phạm, nhắc nhở toàn đội tuân thủ nội quy tòa nhà và quy trình làm việc.';
  if(acts.some(a=>/thay|điều chuyển|sa thải|đổi người/i.test(a))) s+=' Thay thế/điều chuyển nhân sự vi phạm theo chế tài hợp đồng'+(d.service==='SECURITY'?' trong vòng 24 giờ':'')+' và cập nhật danh sách nhân sự cho BQL.';
  if(acts.some(a=>/bổ sung/i.test(a))) s+=' Bổ sung đầy đủ công cụ/nhân sự theo hợp đồng trong thời hạn quy định.';
  if((d.lines||[]).some(l=>l.comp)) s+=' Bồi thường thiệt hại theo giá trị đã xác định trong biên bản.';
  s+=` Báo cáo kết quả khắc phục bằng văn bản cho BQL trong vòng ${c.remedyDays||3} ngày.`;
  return s;
}
async function switchContract(b, s){
  const d=CUR.draft;

    if(!(await confirmBox('Đổi hợp đồng','Biên bản đang có lỗi theo hợp đồng hiện tại. Đổi tòa nhà/dịch vụ sẽ xóa danh sách lỗi đã chọn. Tiếp tục?','Đổi và xóa lỗi',true))) return;
    d.lines=[];
  }
  if(s!==d.service && d.roleB===defaultRoleB(d.service)) d.roleB=defaultRoleB(s);
  d.building=b; d.service=s; d.contractKey=ckey(b,s); CUR.lineEdit=null; CUR.dirty=true; renderView();
}

  if(sel) sel.onchange=()=>{ const nl=emptyLine(); nl.code=sel.value; if(nl.code){ const it=c.items.find(i=>i.code===nl.code); nl.title=it.title; nl.ref=it.ref; nl.level=Math.min(priorCount(d,nl.code, CUR.lineEdit.idx>=0?CUR.lineEdit.idx:d.lines.length)+1, it.levels.length); recalcLine(nl); } nl.detail=L.detail; CUR.lineEdit.line=nl; renderLineBox(); };

function recalcLine(L){

}
function refreshLineSuggest(){
  const el=$('#lnSuggest'); if(!el||!CUR.lineEdit) return; const L=CUR.lineEdit.line; const d=CUR.draft; if(!L.code){ el.textContent=''; return; }

}

async function addPhotos(files){
  const room=6-CUR.draftPhotos.length; const arr=[...files].filter(f=>/^image\//.test(f.type)).slice(0,room);

  catch(e){ toast('Không đọc được ảnh: '+e.message, true); }
  busy(false); renderPhotos(); refreshPreview();
}

  on('abDel', async()=>{ if(!(await confirmBox('Xóa biên bản','Xóa vĩnh viễn biên bản '+(d.no||'nháp')+'?','Xóa',true))) return; busy(true); try{ await STORE.deleteRecord(d.id); toast('Đã xóa.'); CUR.dirty=false; CUR.draft=newDraft(); CUR.draftPhotos=[]; renderView(); }catch(e){ toast('Lỗi: '+e.message,true);} busy(false); });
}
function validateDraft(d, strict){
  const c=getContract(d.contractKey); const errs=[];
  if(c.missing) errs.push('Hợp đồng chưa có trên hệ thống.');
  if(!d.dateTime) errs.push('Thiếu thời điểm ghi nhận.');
  if(strict){ if(!d.location.trim()) errs.push('Thiếu vị trí/khu vực.'); if(!d.repA.trim()) errs.push('Thiếu đại diện Bên A.'); if(!d.lines.length) errs.push('Chưa có lỗi vi phạm nào.'); }
  return errs;
}
async function saveDraft(status){
  const d=CUR.draft; const strict = status!=='draft';
  if(status==='approved' && (!isAdmin() || d.status!=='pending')) return toast('Chỉ admin được duyệt biên bản đang chờ duyệt.', true);
  if(status==='pending' && !canEdit(d)) return toast('Không thể gửi biên bản này để duyệt.', true);
  if(status==='draft' && !canEdit(d)) return toast('Không thể chỉnh sửa biên bản này.', true);
  const errs=validateDraft(d, strict); if(errs.length) return toast(errs.join(' '), true);
  if(status==='approved'){
    const over=d.lines.filter(l=>Number(l.amount)!==Number(l.stdAmount));
    if(over.length && !(await confirmBox('Duyệt biên bản', `Có ${over.length} lỗi có số tiền khác mức hợp đồng. Vẫn duyệt thành chính thức?`, 'Duyệt'))) return;
  }
  busy(true,'Đang lưu…');
  try{
    if(!d.no) d.no=nextRecordNo(d);
    const t=recTotals(d); d.totalFine=t.fine; d.totalComp=t.comp;
    const previousStatus=d.status;
    d.status=status; d.photoCount=CUR.draftPhotos.length;
    if(!d.createdAt) d.createdAt=new Date().toISOString();
    if(status==='pending' && previousStatus!=='pending'){
      d.submittedBy=CUR.user.name; d.submittedAt=new Date().toISOString(); d.reviewNote='';
    }
    if(status==='approved'){
      d.approvedBy=CUR.user.name; d.approvedAt=new Date().toISOString(); d.reviewNote='';
    }
    await STORE.savePhotos(d.id, d.building, CUR.draftPhotos, CUR.prevPhotoCount);
    CUR.prevPhotoCount=CUR.draftPhotos.length;
    await STORE.saveRecord(JSON.parse(JSON.stringify(d)));
    CUR.dirty=false;
    toast((status==='approved'?'Admin đã duyệt chính thức ':status==='pending'?'Đã gửi admin duyệt ':'Đã lưu nháp ')+d.no);
  }catch(e){ console.error(e); toast('Lưu thất bại: '+(e.code||e.message)+'. Dữ liệu vẫn còn trên màn hình — thử lại.', true); }
  busy(false); renderView();
}
async function rejectDraft(){
  const d=CUR.draft;
  if(!isAdmin()||d.status!=='pending') return toast('Chỉ admin được từ chối biên bản đang chờ duyệt.', true);
  const reason=await promptBox('Từ chối biên bản','Lý do từ chối (bắt buộc)','Nêu rõ nội dung cần chỉnh sửa hoặc căn cứ từ chối…');
  if(reason===null) return;
  if(!reason) return toast('Vui lòng nhập lý do từ chối.', true);
  busy(true,'Đang lưu quyết định…');

    d.status='rejected'; d.reviewNote=reason; d.rejectedBy=CUR.user.name; d.rejectedAt=new Date().toISOString();

}

  };
  $$('[data-np]').forEach(x=>x.onclick=()=>{ const n=DB.notices.find(y=>y.id===x.dataset.np); exportPDF(renderNoticeDoc(n,{pdf:true, issued:true}), `Thong-bao_${safeName(n.no)}.pdf`); });
  $$('[data-nm]').forEach(x=>x.onclick=()=>emailForNotice(DB.notices.find(y=>y.id===x.dataset.nm)));
  $$('[data-nd]').forEach(x=>x.onclick=async()=>{ if(!(await confirmBox('Xóa thông báo','Xóa thông báo đã phát hành khỏi hệ thống?','Xóa',true))) return; await STORE.deleteNotice(x.dataset.nd); toast('Đã xóa.'); });

/* =====================================================================
   5. DASHBOARD
   ===================================================================== */
function viewDash(v){
  const F=CUR.f.dash; const P=F.p; const keys=contractKeysFor(CUR.user).filter(k=>!getContract(k).missing);
  const recsM=DB.records.filter(r=>periodOf(r.dateTime)===P && keys.includes(r.contractKey));
  const appr=recsM.filter(r=>r.status==='approved');
  const sums=keys.map(k=>monthSummary(k,P));
  const totalDeduct=sums.reduce((s,x)=>s+x.total,0);
  const pending=DB.records.filter(r=>r.status!=='approved' && keys.includes(r.contractKey));
  const warnC=sums.filter(s=>s.alerts.some(a=>a.lv==='bad')).length;
  const months=[...Array(6)].map((_,i)=>addMonths(P,i-5));
  const trend=months.map(m=>({m, v:keys.reduce((s,k)=>s+monthSummary(k,m).fines,0), n:DB.records.filter(r=>r.status==='approved'&&periodOf(r.dateTime)===m&&keys.includes(r.contractKey)).length}));
  const mx=Math.max(1,...trend.map(t=>t.v));
  const byC=sums.map(s=>({k:s.c.building+'_'+s.c.service, name:`${BUILDINGS[s.c.building].name} · ${SERVICES[s.c.service].name}`, v:s.total, n:s.approved.length})).sort((a,b)=>b.v-a.v);
  const mxC=Math.max(1,...byC.map(x=>x.v));
  // tái phạm
  const rep={}; recsM.forEach(r=>(r.lines||[]).forEach(l=>{ const k=r.contractKey+'|'+l.code; rep[k]=rep[k]||{k:r.contractKey, code:l.code, title:l.title, n:0, maxLv:0, amt:0}; rep[k].n++; rep[k].maxLv=Math.max(rep[k].maxLv,l.level||1); rep[k].amt+=Number(l.amount)||0; }));
  const repeats=Object.values(rep).filter(x=>x.n>=2).sort((a,b)=>b.n-a.n);
  // top lỗi 6 tháng
  const top={}; DB.records.filter(r=>r.status==='approved'&&months.includes(periodOf(r.dateTime))&&keys.includes(r.contractKey)).forEach(r=>(r.lines||[]).forEach(l=>{ const k=r.service+'|'+l.title; top[k]=top[k]||{s:r.service,title:l.title,n:0,amt:0}; top[k].n++; top[k].amt+=Number(l.amount)||0; }));
  const tops=Object.values(top).sort((a,b)=>b.n-a.n).slice(0,8);
  const expired=keys.map(getContract).filter(c=>contractExpired(c));
  v.innerHTML=pageHead('Theo dõi tái phạm','Dashboard chế tài', isAdmin()?'Toàn danh mục Non-CBD':'Tòa nhà '+esc(BUILDINGS[CUR.user.building].name), `<input type="month" id="dP" value="${P}">`)+`
  <div class="kpis">
    <div class="card kpi"><div class="l">Biên bản chính thức</div><div class="v">${appr.length}</div><div class="s">${recsM.length} biên bản lập trong tháng ${periodLabel(P)}</div></div>
    <div class="card kpi"><div class="l">Tổng khấu trừ tháng</div><div class="v">${fmt(totalDeduct)}</div><div class="s">đồng · phạt BB + chất lượng + bồi thường</div></div>
    <div class="card kpi"><div class="l">Biên bản chưa duyệt</div><div class="v" style="color:${pending.length?'var(--copper)':''}">${pending.length}</div><div class="s">nháp, chờ duyệt hoặc bị từ chối</div></div>
    <div class="card kpi"><div class="l">Hợp đồng chạm ngưỡng</div><div class="v" style="color:${warnC?'var(--bad)':''}">${warnC}</div><div class="s">có cảnh báo chấm dứt / vượt mức</div></div>
  </div>
  <div class="dgrid">
    <div class="card"><div class="card-h"><h3>Tiền phạt theo biên bản · 6 tháng</h3></div><div class="card-b">
      <div class="vbars">${trend.map(t=>`<div class="col"><div class="cap">${t.v?fmt(t.v/1000)+'k':''}</div><div class="bar ${t.m===P?'cur':''}" style="height:${t.v/mx*100}%" data-tip="Tháng ${periodLabel(t.m)}: ${fmtd(t.v)} · ${t.n} BB"></div></div>`).join('')}</div>
      <div class="vlabels">${trend.map(t=>`<div>${periodLabel(t.m)}</div>`).join('')}</div>
      <div class="hint">Đơn vị trên cột: nghìn đồng. Tháng đang xem tô màu đồng.</div>
    </div></div>
    <div class="card"><div class="card-h"><h3>Tổng khấu trừ theo hợp đồng · ${periodLabel(P)}</h3></div><div class="card-b">
      ${byC.map(x=>`<div class="hbar"><div class="nm" title="${esc(x.name)}">${esc(x.name)}</div><div class="trk"><div class="fill" style="width:${x.v/mxC*100}%" data-tip="${esc(x.name)}: ${fmtd(x.v)} · ${x.n} BB"></div></div><div class="val">${fmt(x.v)}</div></div>`).join('')||'<div class="empty">Không có dữ liệu</div>'}
    </div></div>
    <div class="card"><div class="card-h"><h3>Tái phạm trong tháng (≥ 2 lần)</h3></div><div class="tbl-wrap">
      ${repeats.length?`<table class="t"><thead><tr><th>Hợp đồng</th><th>Lỗi</th><th class="num">Số lần</th><th class="num">Lần cao nhất</th><th class="num">Tiền phạt</th></tr></thead><tbody>${repeats.map(x=>`<tr><td>${esc(contractLabel(x.k))}</td><td>${esc(x.code)} · ${esc(x.title.slice(0,70))}</td><td class="num"><b>${x.n}</b></td><td class="num">${x.maxLv}</td><td class="num">${fmt(x.amt)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Không có lỗi tái phạm trong tháng ${periodLabel(P)}.</div>`}
    </div></div>
    <div class="card"><div class="card-h"><h3>Lỗi phổ biến · 6 tháng</h3></div><div class="tbl-wrap">
      ${tops.length?`<table class="t"><thead><tr><th>Dịch vụ</th><th>Lỗi</th><th class="num">Số lần</th><th class="num">Tiền phạt</th></tr></thead><tbody>${tops.map(x=>`<tr><td>${SERVICES[x.s].name}</td><td>${esc(x.title.slice(0,80))}</td><td class="num"><b>${x.n}</b></td><td class="num">${fmt(x.amt)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Chưa có dữ liệu.</div>`}
    </div></div>
  </div>
  <div class="card" style="margin-top:16px"><div class="card-h"><h3>Cảnh báo theo hợp đồng</h3></div><div class="card-b">
    ${sums.flatMap(s=>s.alerts.filter(a=>a.lv==='bad').map(a=>`<div class="flag bad">${ic('alert')}<div><b>${esc(contractLabel(s.c.building+'_'+s.c.service))}:</b> ${esc(a.t)}</div></div>`)).join('')}
    ${expired.map(c=>`<div class="flag">${ic('alert')}<div><b>${esc(contractLabel(c.building+'_'+c.service))}:</b> hợp đồng theo hồ sơ hết hạn ${dDMY(c.termTo)} — cần cập nhật phụ lục gia hạn.</div></div>`).join('')}
    ${keys.length<contractKeysFor(CUR.user).length?`<div class="flag">${ic('info')}<div>Chưa có HĐ trên hệ thống: ${contractKeysFor(CUR.user).filter(k=>getContract(k).missing).map(k=>esc(contractLabel(k))).join(', ')}.</div></div>`:''}
    ${!sums.some(s=>s.alerts.some(a=>a.lv==='bad'))&&!expired.length?'<div class="hint">Không có cảnh báo.</div>':''}
  </div></div>`;
  $('#dP').onchange=e=>{ F.p=e.target.value||curPeriod(); viewDash(v); };
  // tooltip
  let tip=null;
  $$('[data-tip]',v).forEach(el=>{ el.onmouseenter=e=>{ tip=document.createElement('div'); tip.className='tip'; tip.textContent=el.dataset.tip; document.body.appendChild(tip); }; el.onmousemove=e=>{ if(tip){ tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY-30)+'px'; } }; el.onmouseleave=()=>{ if(tip) tip.remove(); tip=null; }; });
}
