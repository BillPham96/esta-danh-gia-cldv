function viewContracts(v){
  const keys=contractKeysFor(CUR.user);
  v.innerHTML=pageHead('Cấu hình','Hợp đồng & danh mục mức phạt', isAdmin()?'Dữ liệu trích từ bản scan hợp đồng. Anh có thể chỉnh sửa, thêm lỗi, cập nhật phụ lục mới — bản sửa áp dụng cho các biên bản lập sau đó.':'Danh mục lỗi và mức phạt đang áp dụng (chỉ xem).')+
  `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px">${keys.map(k=>{ const c=getContract(k);
    return `<div class="card"><div class="card-h"><h3>${esc(contractLabel(k))}</h3>${c.missing?'<span class="pill s-returned">Chưa có HĐ</span>':contractExpired(c)?'<span class="pill s-pending">Hết hạn theo hồ sơ</span>':'<span class="pill s-approved">Đang áp dụng</span>'}</div><div class="card-b">
      ${c.missing?`<div class="hint">Chưa có hợp đồng trên hệ thống.</div>`:`<dl class="kv" style="margin-top:0"><dt>Nhà thầu</dt><dd>${esc(partyBShort(c))}</dd><dt>Số HĐ</dt><dd>${esc(c.contractNo)}</dd><dt>Thời hạn</dt><dd>${dDMY(c.termFrom)} – ${c.termTo?dDMY(c.termTo):'…'}</dd><dt>Phí DV/tháng</dt><dd>${fmtd(c.monthlyFee)}</dd><dt>Danh mục lỗi</dt><dd>${(c.items||[]).length} hạng mục</dd></dl>`}
      ${(c.flags||[]).map(f=>`<div class="flag">${ic('info')}<div>${esc(f)}</div></div>`).join('')}
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn ${isAdmin()?'btn-p':'btn-o'} btn-sm" data-ce="${k}">${ic(isAdmin()?'edit':'list')}${isAdmin()?'Chỉnh sửa':'Xem chi tiết'}</button>${c._edited&&isAdmin()&&CONTRACT_SEED[k]&&!CONTRACT_SEED[k].missing?`<button class="btn btn-g btn-sm" data-cr="${k}">${ic('undo')}Khôi phục theo bản scan HĐ</button>`:''}${c._edited?'<span class="hint" style="margin:6px 0 0">Đã chỉnh sửa trên web</span>':''}</div>
    </div></div>`; }).join('')}</div>`;
  $$('[data-ce]',v).forEach(b=>b.onclick=()=>contractEditor(b.dataset.ce));
  $$('[data-cr]',v).forEach(b=>b.onclick=async()=>{ if(!(await confirmBox('Khôi phục','Bỏ các chỉnh sửa trên web và dùng lại dữ liệu trích từ bản scan hợp đồng?','Khôi phục',true))) return; await STORE.resetContract(b.dataset.cr); toast('Đã khôi phục.'); });
}
function levelSummary(L){ return L.map((l,i)=>`L${i+1}: ${l.pct!=null?(l.pct+(l.pctMax!=null?'–'+l.pctMax:'')+'% '+({fee:'phí tháng',contract:'giá trị HĐ',asset:'giá trị TS'}[l.base]||'')):l.min!=null?(fmt(l.min)+(l.max!=null?'–'+fmt(l.max):'+')):fmt(l.a)}`).join(' · '); }
function contractEditor(key){
  const c=JSON.parse(JSON.stringify(getContract(key))); delete c._edited; const ro=!isAdmin();
  const f=(lbl,path,type='text',span)=>{ const val=path.split('.').reduce((o,k)=>o&&o[k],c); return `<div class="${span?'span2':''}"><label class="f">${lbl}</label>${type==='area'?`<textarea data-p="${path}" rows="2" ${ro?'disabled':''}>${esc(val||'')}</textarea>`:`<input type="${type}" data-p="${path}" value="${esc(val==null?'':val)}" ${ro?'disabled':''}>`}</div>`; };
  const body=`
    <h4 style="margin:0 0 8px;color:var(--aub);font-size:12px;text-transform:uppercase;letter-spacing:.08em">Bên A – Bên sử dụng dịch vụ</h4>
    <div class="grid2">${f('Tên pháp nhân','partyA.name')}${f('MST','partyA.tax')}${f('Địa chỉ','partyA.addr','text',true)}${f('Người đại diện','partyA.rep')}${f('Chức vụ','partyA.repRole')}</div>
    <h4 style="margin:16px 0 8px;color:var(--aub);font-size:12px;text-transform:uppercase;letter-spacing:.08em">Bên B – Nhà thầu</h4>
    <div class="grid2">${f('Tên pháp nhân','partyB.name')}${f('MST','partyB.tax')}${f('Địa chỉ','partyB.addr','text',true)}${f('Người đại diện','partyB.rep')}${f('Chức vụ','partyB.repRole')}</div>
    <h4 style="margin:16px 0 8px;color:var(--aub);font-size:12px;text-transform:uppercase;letter-spacing:.08em">Hợp đồng</h4>
    <div class="grid2">${f('Số hợp đồng','contractNo')}${f('Ngày ký','contractDate','date')}${f('Phụ lục đang áp dụng','appendix','text',true)}${f('Căn cứ phạt (phụ lục)','penaltyRef','text',true)}${f('Hiệu lực từ','termFrom','date')}${f('Hiệu lực đến','termTo','date')}${f('Phí dịch vụ chuẩn/tháng (chưa VAT)','monthlyFee','number')}${f('Giá trị hợp đồng (dùng cho lỗi tính % giá trị HĐ)','contractValue','number')}${f('Diễn giải phí','feeNote','text',true)}${f('Trần phạt (% phí tháng)','capPct','number')}${f('Thời hạn khắc phục mặc định (ngày)','remedyDays','number')}
    <div><label class="f">Đếm lần tái phạm</label><select data-p="offensePeriod" ${ro?'disabled':''}><option value="month" ${c.offensePeriod!=='term'?'selected':''}>Trong cùng tháng</option><option value="term" ${c.offensePeriod==='term'?'selected':''}>Trong suốt thời hạn HĐ</option></select></div></div>
    <h4 style="margin:16px 0 8px;color:var(--aub);font-size:12px;text-transform:uppercase;letter-spacing:.08em">Điều khoản trích dẫn trên văn bản</h4>
    <div class="grid2">${f('Quyền khấu trừ (in trên biên bản)','clauses.deduct','area',true)}${f('Điều khoản nhắc nhở / khắc phục (in trên thông báo)','clauses.notice','area',true)}${f('Điều khoản chấm dứt HĐ','clauses.termination','area',true)}${f('Điều khoản bồi thường','clauses.compensation','area',true)}</div>
    <h4 style="margin:16px 0 8px;color:var(--aub);font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center">Danh mục lỗi & mức phạt ${ro?'':`<button class="btn btn-o btn-sm" id="itAdd">${ic('plus')}Thêm lỗi</button>`}</h4>
    <div id="itTbl"></div>
    <h4 style="margin:16px 0 8px;color:var(--aub);font-size:12px;text-transform:uppercase;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center">Khung điểm chất lượng tháng ${ro?'':`<button class="btn btn-o btn-sm" id="tiAdd">${ic('plus')}Thêm khung</button>`}</h4>
    <div id="tiTbl"></div>`;
  modal({title:(ro?'Hợp đồng · ':'Chỉnh sửa hợp đồng · ')+contractLabel(key), body, wide:true,
    foot: ro?`<button class="btn btn-o" data-x>Đóng</button>`:`<button class="btn btn-o" data-x>Hủy</button><button class="btn btn-p" id="ceSave">${ic('save')}Lưu hợp đồng</button>`,
    onMount:(el,close)=>{
      const drawItems=()=>{ $('#itTbl',el).innerHTML=`<table class="t"><thead><tr><th style="width:50px">Mã</th><th>Hành vi vi phạm</th><th>Mức phạt theo lần</th>${ro?'':'<th></th>'}</tr></thead><tbody>${(c.items||[]).map((it,i)=>`<tr><td><b>${esc(it.code)}</b></td><td>${esc(it.title)}<div class="muted">${esc(it.ref||'')}</div></td><td><div class="muted">${esc(levelSummary(it.levels||[]))}</div>${(it.levels||[]).map((l,j)=>`<div style="font-size:11px">Lần ${j+1}${j===it.levels.length-1&&it.levels.length>1?'+':''}: ${esc(l.t)}</div>`).join('')}</td>${ro?'':`<td style="white-space:nowrap"><button class="btn btn-g btn-sm" data-ie="${i}">${ic('edit')}</button><button class="btn btn-g btn-sm" data-id="${i}">${ic('trash')}</button></td>`}</tr>`).join('')||'<tr><td colspan="4" class="empty">Chưa có lỗi nào</td></tr>'}</tbody></table>`;
        $$('[data-ie]',el).forEach(b=>b.onclick=()=>itemEditor(c.items[+b.dataset.ie], it=>{ c.items[+b.dataset.ie]=it; drawItems(); }));
        $$('[data-id]',el).forEach(b=>b.onclick=()=>{ c.items.splice(+b.dataset.id,1); drawItems(); }); };
      const drawTiers=()=>{ $('#tiTbl',el).innerHTML=(c.tiers||[]).length||!ro?`<table class="t"><thead><tr><th style="width:80px">Từ (%)</th><th style="width:80px">Đến (%)</th><th style="width:80px">% trừ phí</th><th>Tên mức</th><th>Chế tài</th>${ro?'':'<th></th>'}</tr></thead><tbody>${(c.tiers||[]).map((t,i)=>`<tr>${['min','max','pct','label','action'].map(k=>`<td><input data-t="${i}.${k}" value="${esc(t[k])}" ${ro?'disabled':''} ${['min','max','pct'].includes(k)?'type="number" step="0.01"':''}></td>`).join('')}${ro?'':`<td><button class="btn btn-g btn-sm" data-td="${i}">${ic('trash')}</button></td>`}</tr>`).join('')}</tbody></table>`:'<div class="hint">Không quy định.</div>';
        $$('[data-t]',el).forEach(inp=>inp.oninput=()=>{ const [i,k]=inp.dataset.t.split('.'); c.tiers[+i][k]=['min','max','pct'].includes(k)?Number(inp.value):inp.value; });
        $$('[data-td]',el).forEach(b=>b.onclick=()=>{ c.tiers.splice(+b.dataset.td,1); drawTiers(); }); };
      drawItems(); drawTiers();
      if(ro) return;
      $('#itAdd',el).onclick=()=>itemEditor({code:'', title:'', ref:'', levels:[{a:0,t:''}]}, it=>{ c.items=c.items||[]; c.items.push(it); drawItems(); });
      $('#tiAdd',el).onclick=()=>{ c.tiers=c.tiers||[]; c.tiers.push({min:0,max:0,pct:0,label:'',action:''}); drawTiers(); };
      $('#ceSave',el).onclick=async()=>{
        $$('[data-p]',el).forEach(inp=>{ const ps=inp.dataset.p.split('.'); let o=c; for(let i=0;i<ps.length-1;i++){ o[ps[i]]=o[ps[i]]||{}; o=o[ps[i]]; } o[ps[ps.length-1]]=inp.type==='number'?Number(inp.value):inp.value; });
        if(c.partyB.name && (c.items||[]).length) c.missing=false;
        c.flags=(c.flags||[]).filter(x=>!/^Chưa có hợp đồng/.test(x));
        try{ await STORE.saveContract(key, c); toast('Đã lưu hợp đồng.'); close(); }catch(e){ toast('Lỗi: '+e.message,true); }
      };
    }});
}
function itemEditor(item, onSave){
  const it=JSON.parse(JSON.stringify(item));
  const kindOf=l=>l.pct!=null?('pct_'+(l.base||'fee')):l.min!=null?'range':'fixed';
  const draw=(el)=>{ $('#lvBox',el).innerHTML=it.levels.map((l,i)=>{ const k=kindOf(l); return `<div class="card" style="padding:10px 12px;margin-bottom:8px;box-shadow:none"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b style="font-size:12px;color:var(--aub)">Lần ${i+1}${i===it.levels.length-1?' (và các lần sau)':''}</b><button class="btn btn-g btn-sm" data-lr="${i}">${ic('trash')}</button></div>
    <div class="grid3"><div><label class="f">Cách tính</label><select data-lk="${i}"><option value="fixed" ${k==='fixed'?'selected':''}>Số tiền cố định</option><option value="range" ${k==='range'?'selected':''}>Khung tiền (từ – đến)</option><option value="pct_fee" ${k==='pct_fee'?'selected':''}>% phí dịch vụ tháng</option><option value="pct_contract" ${k==='pct_contract'?'selected':''}>% giá trị hợp đồng</option><option value="pct_asset" ${k==='pct_asset'?'selected':''}>% giá trị tài sản</option></select></div>
    ${k==='fixed'?`<div><label class="f">Số tiền (đ)</label><input type="number" data-lv="${i}.a" value="${l.a||0}"></div><div></div>`:k==='range'?`<div><label class="f">Từ (đ)</label><input type="number" data-lv="${i}.min" value="${l.min||0}"></div><div><label class="f">Đến (đ, trống = không giới hạn)</label><input type="number" data-lv="${i}.max" value="${l.max==null?'':l.max}"></div>`:`<div><label class="f">Tỷ lệ (%)</label><input type="number" step="0.01" data-lv="${i}.pct" value="${l.pct||0}"></div><div><label class="f">Tỷ lệ tối đa (%, nếu là khung)</label><input type="number" step="0.01" data-lv="${i}.pctMax" value="${l.pctMax==null?'':l.pctMax}"></div>`}
    <div class="span2" style="grid-column:1/-1"><label class="f">Hình thức xử lý (in trên biên bản)</label><input data-lv="${i}.t" value="${esc(l.t||'')}"></div></div></div>`; }).join('');
    $$('[data-lk]',el).forEach(s=>s.onchange=()=>{ const i=+s.dataset.lk; const t=it.levels[i].t; const v=s.value; it.levels[i]= v==='fixed'?{a:0,t}:v==='range'?{min:0,max:null,t}:{pct:0,base:v.split('_')[1],t}; draw(el); });
    $$('[data-lv]',el).forEach(inp=>inp.oninput=()=>{ const [i,k]=inp.dataset.lv.split('.'); it.levels[+i][k]= k==='t'?inp.value:(inp.value===''?null:Number(inp.value)); });
    $$('[data-lr]',el).forEach(b=>b.onclick=()=>{ if(it.levels.length<=1) return toast('Cần ít nhất 1 mức.',true); it.levels.splice(+b.dataset.lr,1); draw(el); });
  };
  modal({title:'Lỗi vi phạm', body:`<div class="grid2"><div><label class="f">Mã / STT</label><input id="iCode" value="${esc(it.code)}"></div><div><label class="f">Căn cứ (điều khoản)</label><input id="iRef" value="${esc(it.ref||'')}"></div><div class="span2"><label class="f">Hành vi vi phạm</label><textarea id="iTitle" rows="2">${esc(it.title)}</textarea></div><div><label class="f">Nhãn số lượng</label><input id="iQty" value="${esc(it.qtyLabel||'')}" placeholder="Số lượng"></div><div><label class="f" style="margin-top:22px"><input type="checkbox" id="iComp" ${it.comp?'checked':''} style="width:auto"> Có bồi thường thiệt hại</label></div></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px"><label class="f" style="margin:0">Mức phạt theo lần vi phạm</label><button class="btn btn-o btn-sm" id="lvAdd">${ic('plus')}Thêm lần</button></div><div id="lvBox"></div>`,
    foot:`<button class="btn btn-o" data-x>Hủy</button><button class="btn btn-p" id="iSave">Lưu lỗi</button>`,
    onMount:(el,close)=>{ draw(el);
      $('#lvAdd',el).onclick=()=>{ it.levels.push({a:0,t:''}); draw(el); };
      $('#iSave',el).onclick=()=>{ it.code=$('#iCode',el).value.trim(); it.title=$('#iTitle',el).value.trim(); it.ref=$('#iRef',el).value.trim(); it.qtyLabel=$('#iQty',el).value.trim(); it.comp=$('#iComp',el).checked;
        if(!it.code||!it.title) return toast('Nhập mã và hành vi vi phạm.',true); onSave(it); close(); };
    }});
}

/* =====================================================================
   SAO LƯU / KHÔI PHỤC DỮ LIỆU
   ===================================================================== */
function downloadText(text, filename, type='application/json'){
  const blob=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
async function doExport(){
  busy(true,'Đang tạo file sao lưu…');
  try{
    const data=await STORE.exportData(CUR.user);
    const d=new Date(); const stamp=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
    const scope=CUR.user.role==='admin'?'TOAN-BO':BUILDINGS[CUR.user.building].short;
    downloadText(JSON.stringify(data), `ESTA-CLDV_${scope}_${stamp}.json`);
    lsSet('esta_cldv_lastbackup_'+CUR.user.id, new Date().toISOString());
    toast(`Đã xuất ${data.records.length} biên bản ra file sao lưu.`); updateBadges();
  }catch(e){ toast('Xuất file lỗi: '+e.message, true); }
  busy(false);
}
function dataModal(){
  const mine=DB.records.length;
  modal({title:'Dữ liệu trên máy này', body:`
    <p style="margin:0 0 10px">Web không có máy chủ: biên bản, ảnh, điểm đánh giá và thông báo được lưu ngay trong trình duyệt của máy đang dùng (${mine} biên bản). Xóa lịch sử trình duyệt hoặc đổi máy sẽ mất dữ liệu nếu chưa sao lưu.</p>
    <div class="card" style="padding:14px 16px;margin-bottom:12px;box-shadow:none"><b style="color:var(--aub)">1. Xuất file sao lưu</b><div class="hint">Tải về 1 file .json chứa toàn bộ dữ liệu ${isAdmin()?'của tất cả tòa nhà trên máy này':'của tòa nhà'} (kể cả ảnh). Nên làm mỗi tuần và gửi file cho Quản lý vận hành.</div><button class="btn btn-p btn-sm" id="dmExp" style="margin-top:8px">${ic('pdf')}Xuất file sao lưu</button></div>
    <div class="card" style="padding:14px 16px;box-shadow:none"><b style="color:var(--aub)">2. Nhập file sao lưu</b><div class="hint">Gộp dữ liệu từ file vào máy này: biên bản mới được thêm, biên bản trùng giữ bản sửa sau cùng. ${isAdmin()?'Anh dùng để gộp file các BQL gửi về.':'Chỉ nhận dữ liệu của tòa nhà mình.'}</div>
      <label class="hint" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="dmCt" style="width:auto" ${isAdmin()?'':'checked'}> Nhập cả cấu hình Hợp đồng &amp; mức phạt trong file (file do Quản lý vận hành xuất)</label>
      <input type="file" id="dmFile" accept=".json,application/json" style="margin-top:8px"></div>`,
    foot:`<button class="btn btn-o" data-x>Đóng</button>`,
    onMount:(el,close)=>{
      $('#dmExp',el).onclick=()=>doExport();
      $('#dmFile',el).onchange=async e=>{
        const f=e.target.files[0]; if(!f) return;
        busy(true,'Đang nhập dữ liệu…');
        try{ const data=JSON.parse(await f.text()); const r=await STORE.importData(data, CUR.user, $('#dmCt',el).checked);
          toast(`Đã nhập: ${r.add} biên bản mới, ${r.upd} biên bản cập nhật${r.skip?`, bỏ qua ${r.skip}`:''}${r.ct?`, ${r.ct} cấu hình hợp đồng`:''}.`); close(); renderView(); }
        catch(err){ toast('Không nhập được file: '+err.message, true); }
        busy(false); e.target.value='';
      };
    }});
}

/* =====================================================================
   NỘI DUNG EMAIL
   ===================================================================== */
function emailBox(subject, body){
  modal({title:'Nội dung email gửi nhà thầu', wide:true, body:`
    <label class="f" for="emSub">Tiêu đề</label><div style="display:flex;gap:8px"><input id="emSub" value="${esc(subject)}"><button class="btn btn-o btn-sm" data-cp="emSub">${ic('copy')}Sao chép</button></div>
    <label class="f" for="emBody" style="margin-top:12px">Nội dung</label><textarea id="emBody" rows="16">${esc(body)}</textarea>
    <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button class="btn btn-p btn-sm" data-cp="emBody">${ic('copy')}Sao chép nội dung</button><span class="hint" style="margin:0">Dán vào Outlook/Gmail và đính kèm file PDF đã xuất.</span></div>`,
    foot:`<button class="btn btn-o" data-x>Đóng</button>`,
    onMount:(el)=>{ $$('[data-cp]',el).forEach(b=>b.onclick=async()=>{ const t=$('#'+b.dataset.cp,el); try{ await navigator.clipboard.writeText(t.value); toast('Đã sao chép.'); }catch(e){ t.focus(); t.select(); try{ document.execCommand('copy'); toast('Đã sao chép.'); }catch(_){ toast('Không tự sao chép được — nội dung đã được chọn, bấm Ctrl+C.', true); } } }); }});
}
function signature(){ return `\nTrân trọng,\n${CUR.user.name}\n${isAdmin()?'Quản lý vận hành Non-CBD':'Ban Quản lý Tòa nhà '+BUILDINGS[CUR.user.building].name}\nESTA Property Management – A L'MAK Company`; }
function emailForRecord(r){
  const c=getContract(r.contractKey); const b=BUILDINGS[r.building]; const t=recTotals(r);
  const subject=`[${b.name}] Biên bản vi phạm ${r.no||''} – ${SERVICES[r.service].full} – ${dDMY(r.dateTime)}`;
  const lines=(r.lines||[]).map((l,i)=>`  ${i+1}. ${l.title} (lần ${l.level}, SL ${l.qty}): ${l.action}${l.amount?` – ${fmtd(l.amount)}`:''}${l.comp?`; bồi thường ${fmtd(l.comp)}`:''}`).join('\n');
  const body=`Kính gửi: ${c.partyB.name||'Quý Công ty'}${c.partyB.rep?`\nĐại diện: ${c.partyB.rep} – ${c.partyB.repRole}`:''}

Căn cứ Hợp đồng dịch vụ số ${c.contractNo}${c.appendix?` và ${c.appendix}`:''}, Ban Quản lý Tòa nhà ${b.name} gửi Quý Công ty biên bản ghi nhận vi phạm số ${r.no||'(nháp)'} lập lúc ${tHM(r.dateTime)} ngày ${dDMY(r.dateTime)} tại ${r.location||'tòa nhà'}${r.violator?`, nhân sự vi phạm: ${r.violator}`:''}.

Nội dung vi phạm và chế tài theo hợp đồng:
${lines}

Tổng tiền phạt${t.comp?' và bồi thường':''}: ${fmtd(t.fine+t.comp)} (${numToWords(t.fine+t.comp).toLowerCase()}), khấu trừ vào phí dịch vụ tháng ${periodLabel(periodOf(r.dateTime))}.

Yêu cầu khắc phục: ${r.remedy||'Bên B chấn chỉnh nhân sự và báo cáo kết quả khắc phục bằng văn bản.'}${r.remedyDeadline?`\nThời hạn hoàn thành: trước ngày ${dDMY(r.remedyDeadline)}.`:''}

Biên bản chi tiết (PDF) đính kèm email này. Đề nghị Quý Công ty xác nhận, ký biên bản và phản hồi kết quả khắc phục đúng thời hạn.
${signature()}`;
  emailBox(subject, body);
}
function emailForNotice(n){
  const c=getContract(n.contractKey); const b=BUILDINGS[c.building]; const T=NOTICE_TYPES[n.type]||NOTICE_TYPES.remind1;
  const recs=(n.recordIds||[]).map(id=>DB.records.find(r=>r.id===id)).filter(Boolean);
  const sum=recs.reduce((s,r)=>s+recTotals(r).fine,0);
  const subject=`[${b.name}] ${n.subject||T.subject}${n.no?` – Số ${n.no}`:''}`;
  const body=`Kính gửi: ${c.partyB.name||'Quý Công ty'}

Ban Quản lý Tòa nhà ${b.name} gửi Quý Công ty thông báo ${n.no?`số ${n.no} `:''}về việc: ${n.subject||T.subject}.

Trong tháng ${periodLabel(n.period)}, Ban Quản lý đã lập ${recs.length} biên bản ghi nhận vi phạm${recs.length?` (${recs.map(r=>r.no).join(', ')})`:''}${sum?`, tổng tiền phạt ${fmtd(sum)} khấu trừ vào phí dịch vụ tháng ${periodLabel(n.period)}`:''}.

Đề nghị Quý Công ty khắc phục triệt để trong vòng ${n.deadlineDays||c.remedyDays||3} ngày kể từ ngày nhận thông báo và báo cáo kết quả bằng văn bản cho Ban Quản lý.${n.type!=='remind1'&&c.clauses.notice?`\n\nLưu ý theo hợp đồng: ${c.clauses.notice}`:''}

Thông báo chi tiết (PDF) đính kèm email này.
${signature()}`;
  emailBox(subject, body);
}
function emailForSummary(key, period){
  const S=monthSummary(key, period); const c=S.c; const b=BUILDINGS[c.building];
  const subject=`[${b.name}] Tổng hợp chế tài & khấu trừ phí dịch vụ ${SERVICES[c.service].name.toLowerCase()} tháng ${periodLabel(period)}`;
  const body=`Kính gửi: ${c.partyB.name||'Quý Công ty'}

Ban Quản lý Tòa nhà ${b.name} gửi Quý Công ty bảng tổng hợp chế tài và khấu trừ phí dịch vụ tháng ${periodLabel(period)} theo Hợp đồng số ${c.contractNo}:

- Số biên bản vi phạm: ${S.approved.length}
- Tiền phạt theo biên bản: ${fmtd(S.fines)}
- Điểm đánh giá chất lượng: ${S.score!=null?S.score+'%':'chưa đánh giá'}${S.tier?` (${S.tier.label})`:''}; trừ theo chất lượng: ${fmtd(S.qualityDeduct)}
- Bồi thường thiệt hại: ${fmtd(S.comp)}
- Tổng khấu trừ vào phí dịch vụ tháng ${periodLabel(period)}: ${fmtd(S.total)} (${numToWords(S.total).toLowerCase()})

Bảng tổng hợp chi tiết (PDF) đính kèm. Đề nghị Quý Công ty đối chiếu, ký xác nhận và xuất hóa đơn theo số tiền sau khấu trừ.
${signature()}`;
  emailBox(subject, body);
}

/* =====================================================================
   BOOT
   ===================================================================== */
window.addEventListener('beforeunload', e=>{ if(CUR.dirty){ e.preventDefault(); e.returnValue=''; } });
(function boot(){
  const id=lsGet('esta_cldv_session'); const acc=id&&ACCOUNTS[id];
  if(acc){ startApp({uid:id, id, name:lsGet('esta_cldv_name_'+id)||acc.name, account:acc.name, role:acc.role, building:acc.building||''}); return; }
  renderLogin();
})();

</script>
</body>
